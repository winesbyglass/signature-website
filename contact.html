<!-- contact.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Signature Payroll</title>
  <meta name="description" content="Contact Signature Payroll." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo-full.png" alt="Signature Payroll logo" class="logo" />
      </a>

      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="services.html">Services</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link" href="careers.html">Careers</a>
        <a class="nav-link" href="tools.html">Tools</a>
      </nav>

      <a class="btn btn-primary is-active" href="contact.html">Contact us</a>
    </div>
  </header>

  <main id="main">
    <section class="page-head">
      <div class="container">
        <p class="eyebrow">Contact</p>
        <h1 class="h1">Get in touch</h1>
        <p class="lead">
          We'd love to hear from you. Send us a message and we’ll get back to you shortly.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">

        <!-- LEFT: FORM -->
        <form class="contact-form">
          <div class="form-group">
            <label>Name</label>
            <input type="text" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" required />
          </div>

          <div class="form-group">
            <label>Message</label>
            <textarea rows="5" required></textarea>
          </div>

          <button class="btn btn-primary" type="submit">Send message</button>
        </form>

        <!-- RIGHT: IMAGE -->
        <div class="contact-image">
          <img src="assets/kathy-lychee.jpg" alt="Kathy De Luca with Lychee">
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <nav class="footer-nav">
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="careers.html">Careers</a>
        <a href="tools.html">Tools</a>
      </nav>

      <p class="footer-copy">
        Signature Payroll © 2026 All rights reserved.
      </p>
    </div>
  </footer>
</body>
</html>
